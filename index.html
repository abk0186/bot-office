<title>Офис ботов</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#151a2c;color:#eef1ff;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
body{display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top) + 24px) 18px calc(env(safe-area-inset-bottom) + 24px)}
form{width:min(400px,100%);background:#1a2244ee;border:1px solid #34449a;border-radius:20px;padding:28px 24px 22px;box-shadow:0 12px 40px #0008}
h1{margin:0 0 6px;font-size:15px;letter-spacing:1.2px;text-transform:uppercase}
.sub{color:#b8c0e0;font-size:14px;margin:0 0 18px;line-height:1.4}
input[type=password],input[type=text]{width:100%;height:46px;border:0;border-radius:12px;padding:0 14px;font-size:16px;background:#0f1430;color:#fff}
label.mem{display:flex;align-items:center;gap:8px;margin:14px 0;font-size:14px;color:#d5daf0;cursor:pointer}
button{width:100%;height:46px;border:0;border-radius:12px;background:#3a55d6;color:#fff;font-size:16px;font-weight:700;margin-top:4px}
button:disabled{opacity:.7}
#err{color:#ff9b9b;font-size:13.5px;margin:12px 0 0;display:none;text-align:center}
#wait{color:#c9d0f0;font-size:13.5px;margin:12px 0 0;display:none;text-align:center}
</style>
</head>
<body>
<form id="f" autocomplete="on">

  <input id="pw" type="password" name="password" autocomplete="current-password" required autofocus placeholder="Пароль">
  <label class="mem"><input type="checkbox" id="mem" checked> Запомнить на этом устройстве</label>
  <button id="go" type="submit">Войти</button>
  <p id="err">Неверный пароль</p>
  <p id="wait">Открываю…</p>
</form>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function derive(pw,salt){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:ITER,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt']);
}
async function keyFromRaw(raw){
  return crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},true,['decrypt']);
}
async function unlockWithKey(key){
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(IV)},key,b64(CT));
  const html=new TextDecoder().decode(pt);
  document.open();document.write(html);document.close();
}
function showErr(){document.getElementById('err').style.display='block';document.getElementById('wait').style.display='none';document.getElementById('go').disabled=false}
function showWait(){document.getElementById('err').style.display='none';document.getElementById('wait').style.display='block';document.getElementById('go').disabled=true}
async function tryMem(){
  try{
    const mem=JSON.parse(localStorage.getItem(LS)||'null');
    if(!mem||mem.cid!==CID||!mem.key)return false;
    showWait();
    const raw=b64(mem.key);
    await unlockWithKey(await keyFromRaw(raw));
    return true;
  }catch(e){try{localStorage.removeItem(LS)}catch(_){}showErr();return false}
}
document.getElementById('f').addEventListener('submit',async ev=>{
  ev.preventDefault();
  const pw=document.getElementById('pw').value,mem=document.getElementById('mem').checked;
  showWait();
  try{
    const key=await derive(pw,b64(SALT));
    await unlockWithKey(key);
    if(mem){
      const raw=await crypto.subtle.exportKey('raw',key);
      localStorage.setItem(LS,JSON.stringify({cid:CID,key:btoa(String.fromCharCode(...new Uint8Array(raw)))}));
    }else try{localStorage.removeItem(LS)}catch(_){}
  }catch(e){showErr()}
});
tryMem();
