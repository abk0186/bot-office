<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#151a2c">
<link rel="icon" href="data:,">
<title>Офис ботов</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#151a2c;color:#eef1ff;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;overflow:hidden;overscroll-behavior:none}
#top{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 8px) 56px 8px 14px;background:linear-gradient(#151a2cf2,#151a2c00);z-index:3;pointer-events:none}
#top h1{margin:0;font-size:18px;letter-spacing:.3px}
#stats{font-size:12.5px;color:#b9c3ee;margin-top:3px;line-height:1.35}
#upd{font-size:11px;color:#8590c0;margin-top:2px}
#legendBtn{position:fixed;right:12px;top:calc(env(safe-area-inset-top) + 10px);z-index:4;width:36px;height:36px;border-radius:18px;border:1px solid #46559c;background:#1e2648;color:#fff;font-size:17px;font-weight:700}
#legend{position:fixed;right:12px;top:calc(env(safe-area-inset-top) + 52px);z-index:7;background:#fff;color:#1b2040;border-radius:14px;padding:12px 14px;font-size:13.5px;line-height:1.6;width:min(300px,calc(100vw - 24px));box-shadow:0 8px 30px #0008;display:none}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
#bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 12px);z-index:3;display:flex;gap:6px;align-items:center;background:#1a2244ee;border:1px solid #34449a;border-radius:16px;padding:6px;box-shadow:0 4px 18px #0007;max-width:calc(100vw - 16px)}
#bar button{height:40px;min-width:40px;border-radius:11px;border:0;background:#26315f;color:#fff;font-size:17px;padding:0 10px}
#bar button.on{background:#3a55d6}
#where{font-size:13px;min-width:120px;max-width:170px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
#card{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 70px);z-index:6;width:min(440px,calc(100vw - 16px));max-height:58vh;overflow:auto;background:#fff;color:#1b2040;border-radius:18px;padding:14px 16px 12px;box-shadow:0 10px 40px #000a;display:none}
@media (min-width:900px) and (min-aspect-ratio:13/10){#card{left:auto;right:16px;transform:none;top:86px;bottom:auto;width:400px;max-height:calc(100vh - 170px)}}
#card h2{margin:0 0 2px;font-size:18px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#card .dot{width:10px;height:10px;border-radius:5px;display:inline-block;flex:none}
#card .sub{color:#56608f;font-size:13.5px;margin-bottom:8px}
#card .row{font-size:13.5px;margin:6px 0;line-height:1.4}
#card .k{color:#7a83ad}
#card .chip{display:inline-block;background:#eef1ff;border-radius:9px;padding:3px 8px;margin:3px 4px 1px 0;font-size:12.5px;cursor:pointer}
#card .chip.g{background:#fff1d0}
#card .list div{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-top:1px solid #eef0f8;font-size:14px;cursor:pointer}
#card .back{margin-top:10px;width:100%;height:42px;border:0;border-radius:12px;background:#1b2040;color:#fff;font-size:15px}
#card .tag{font-size:11px;background:#e3e7ff;color:#3047b8;border-radius:6px;padding:1px 6px;font-weight:600}
#card .tag.t{background:#ffe7c2;color:#9a5a00}
.spark{display:flex;gap:2px;align-items:flex-end;height:26px;margin:4px 0 2px}
.spark i{flex:1;background:#3a55d6;border-radius:2px 2px 0 0;min-height:2px}
#err{position:fixed;inset:auto 0 50% 0;text-align:center;color:#ff9b9b;display:none;z-index:9}
</style>

<body>
<div id="top"><h1>Офис ботов</h1><div id="stats">загрузка…</div><div id="upd"></div></div>
<button id="legendBtn" aria-label="Как читать">?</button>
<div id="legend"></div>
<canvas id="c"></canvas>
<div id="bar">
 <button id="prev" aria-label="Назад">‹</button><div id="where">Весь офис</div><button id="next" aria-label="Вперёд">›</button>
 <button id="zout" aria-label="Отдалить">−</button><button id="zin" aria-label="Приблизить">+</button>
 <button id="pause" aria-label="Пауза">❚❚</button>
</div>
<div id="card"></div>
<div id="err"></div>
<script>
'use strict';
const T=16,DPR=Math.min(window.devicePixelRatio||1,3);
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),card=document.getElementById('card');
let D=null,LAY=null,L=null,W=24,H=36,zones=[],zoneById={},bots=[],bySlug={},links=[];
let blocked=null,seatSet=new Set(),reserved=new Set(),decor=[],cand=[],pairCool={};
let cam={x:200,y:300,s:1},camT=null,paused=false,sel=null,selZone=null,viewIdx=-1,animTime=0,schedT=0;
// ---------- время/формат
const pad=n=>String(n).padStart(2,'0');
const ast=ms=>new Date(ms+5*3600e3);
function fmtAbs(ms){if(!ms)return '—';const d=ast(ms),k=x=>x.toISOString().slice(0,10),hm=pad(d.getUTCHours())+':'+pad(d.getUTCMinutes());
 if(k(d)===k(ast(Date.now())))return 'сегодня '+hm;if(k(d)===k(ast(Date.now()-864e5)))return 'вчера '+hm;return pad(d.getUTCDate())+'.'+pad(d.getUTCMonth()+1)+' '+hm}
function plural(n,a,b,c){n=Math.abs(n);const m=n%10,h=n%100;return m==1&&h!=11?a:(m>=2&&m<=4&&(h<10||h>=20)?b:c)}
function fmtAgo(ms){if(!ms)return 'нет данных';const m=(Date.now()-ms)/6e4;if(m<2)return 'только что';if(m<60)return Math.round(m)+' мин назад';if(m<1440)return Math.round(m/60)+' ч назад';const d=Math.round(m/1440);return d+' '+plural(d,'день','дня','дней')+' назад'}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
// ---------- статус
function status(b){const last=b.act.last||b.last_file||0,age=Date.now()-last;if(last&&age<30*6e4)return 'busy';if(last&&age<864e5)return 'today';if(last&&age<7*864e5)return 'week';return 'sleep'}
const ST={busy:['#ffc400','Работает сейчас'],today:['#36c26b','Был активен сегодня'],week:['#5b8cff','Активен на этой неделе'],sleep:['#9aa0b5','Спит больше недели']};
const waiting=b=>b.act.waiting&&b.act.last_user&&Date.now()-b.act.last_user<3*864e5;
// ---------- раскладка
function pickLayout(){const k=innerWidth/innerHeight<1.3?'tall':'wide';if(k===LAY)return false;LAY=k;return true}
const key=(x,y)=>y*W+x;
function block(x,y){if(x>=0&&y>=0&&x<W&&y<H)blocked[key(x,y)]=1}
const free=(x,y)=>x>=0&&y>=0&&x<W&&y<H&&!blocked[key(x,y)];
function build(){
 if(!D)return;L=D.layouts[LAY];W=L.W;H=L.H;blocked=new Uint8Array(W*H);seatSet=new Set();reserved=new Set();decor=[];
 for(let x=0;x<W;x++){block(x,0);block(x,H-1)}for(let y=0;y<H;y++){block(0,y);block(W-1,y)}
 zones=D.zones.filter(z=>L.zones[z.id]).map(z=>{const[x,y,w,h]=L.zones[z.id];return Object.assign({},z,{x,y,w,h,bots:[]})});zoneById={};zones.forEach(z=>zoneById[z.id]=z);
 const prev={};bots.forEach(b=>prev[b.slug]=b);
 bots=D.bots.map(b=>Object.assign({},b,{zone:zoneById[b.zone]?b.zone:'lab'}));bySlug={};
 bots.forEach(b=>{bySlug[b.slug]=b;zoneById[b.zone].bots.push(b);b.st=status(b)});
 zones.forEach(z=>{
  if(z.kind==='cabinet'){ // стены, дверь, большой стол
   const door=LAY==='tall'?'bottom':'right';
   for(let y=z.y;y<=z.y+z.h;y++)if(!(door==='right'&&(y===z.y+2||y===z.y+3)))block(z.x+z.w,y);
   for(let x=z.x;x<=z.x+z.w;x++)if(!(door==='bottom'&&(x===z.x+4||x===z.x+5)))block(x,z.y+z.h);
   z.door=door==='bottom'?{x:z.x+4,y:z.y+z.h,w:2,h:1}:{x:z.x+z.w,y:z.y+2,w:1,h:2};
   const bx=z.x+Math.floor(z.w/2)-1,by=z.y+3;for(let i=0;i<3;i++){block(bx+i,by);block(bx+i,by+1)}
   z.big={x:bx,y:by};for(let i=1;i<=3;i++)block(z.x+i,z.y);decor.push({t:'shelf',x:z.x+1,y:z.y});
   block(z.x+z.w-1,z.y);decor.push({t:'plant',x:z.x+z.w-1,y:z.y});block(z.x,z.y+z.h-1);decor.push({t:'plant',x:z.x,y:z.y+z.h-1});
   z.bots.forEach(b=>{b.kind='boss';b.seat={x:bx+1,y:by-1};b.sit={x:(bx+1.5)*T,y:(by-1+.85)*T};b.stand=[[bx+1,by+2],[bx,by+2],[bx+2,by+2],[bx-1,by+1],[bx+3,by+1]]});
  }else if(z.kind==='table'){
   const tx=Math.floor(z.x+z.w/2),ty=Math.floor(z.y+z.h/2)+1;for(let x=tx-1;x<=tx+1;x++)for(let y=ty-1;y<=ty;y++)block(x,y);
   z.table={x:tx,y:ty};const seats=[[tx,ty-2],[tx-2,ty-1],[tx+2,ty-1],[tx,ty+1]];z.seats=seats;
   z.bots.forEach((b,i)=>{const s=seats[i%3];b.kind='table';b.seat={x:s[0],y:s[1]};b.sit={x:(s[0]+.5)*T,y:(s[1]+.85)*T};b.stand=nbrs(s[0],s[1])});
   z.bossSeat={x:seats[3][0],y:seats[3][1]};
   block(z.x+z.w-1,z.y);decor.push({t:'plant',x:z.x+z.w-1,y:z.y});block(z.x,z.y);decor.push({t:'plant',x:z.x,y:z.y});
   decor.push({t:'board',x:z.x+2,y:z.y});block(z.x+2,z.y);block(z.x+3,z.y);
  }else{
   const n=z.bots.length,cols=Math.max(1,Math.min(n,Math.floor(z.w/4))),cw=z.w/cols;
   z.bots.forEach((b,i)=>{const c=i%cols,r=Math.floor(i/cols);const dx=Math.round(z.x+cw*c+(cw-2)/2),sy=z.y+2+r*4;
    block(dx,sy+1);block(dx+1,sy+1);b.kind='desk';b.desk={x:dx,y:sy+1};b.seat={x:dx,y:sy};b.sit={x:(dx+1)*T,y:(sy+.85)*T};
    b.stand=[[dx-1,sy],[dx+2,sy],[dx,sy-1],[dx+1,sy-1],[dx-1,sy+1],[dx+2,sy+1]]});
   if(free(z.x+z.w-1,z.y)){block(z.x+z.w-1,z.y);decor.push({t:'plant',x:z.x+z.w-1,y:z.y})}
   // низкая перегородка слева с проходом посередине
   if(z.x>2&&!blocked[key(z.x-1,z.y+1)]){const mid=z.y+Math.floor(z.h/2);for(let y=z.y;y<z.y+z.h;y++){if(y===mid||y===mid-1)continue;block(z.x-1,y);decor.push({t:'part',x:z.x-1,y})}}
  }
 });
 // кулер и диван в свободных местах
 const extra=LAY==='wide'?[{t:'sofa',x:14,y:18,w:3},{t:'cooler',x:24,y:18,w:1},{t:'plant',x:12,y:19,w:1},{t:'plant',x:33,y:19,w:1},{t:'printer',x:19,y:18,w:2}]:[{t:'cooler',x:22,y:9,w:1},{t:'printer',x:12,y:9,w:2}];
 extra.forEach(e=>{let ok=true;for(let i=0;i<e.w;i++)if(!free(e.x+i,e.y))ok=false;if(ok){for(let i=0;i<e.w;i++)block(e.x+i,e.y);decor.push(e)}});
 bots.forEach(b=>{seatSet.add(key(b.seat.x,b.seat.y));const p=prev[b.slug];
  if(p&&p.mode&&p.mode!=='seat'){Object.assign(b,{x:b.sit.x,y:b.sit.y,mode:'seat'})}else{b.x=b.sit.x;b.y=b.sit.y;b.mode='seat'}b.talkWith=null;b.lock=0});
 Object.values(zoneById).forEach(z=>{if(z.bossSeat)seatSet.add(key(z.bossSeat.x,z.bossSeat.y))});
 computeCand();
}
function computeCand(){
 // кандидаты визитов из реальных сообщений между ботами
 links=(D.links||[]).filter(l=>l.kind==='data');cand=[];
 links.forEach(l=>{if(!l.last)return;const age=(Date.now()-l.last)/36e5;if(age>24*7)return;
  let v=l.from,t=l.to;if(v==='director'&&bySlug[t])[v,t]=[t,v];
  if(!bySlug[v])return;const target=bySlug[t]?t:(t==='asset20'?'asset20':null);if(!target)return;
  const rec=age<2?8:age<24?4:age<72?2:1;cand.push({v,t:target,w:(1+Math.log2(1+l.n))*rec,n:l.n,last:l.last})});
 const g=(D.groups||[]).find(g=>g.slug==='asset20');
 if(g&&g.act&&g.act.last&&bySlug.director){const age=(Date.now()-g.act.last)/36e5;if(age<24*7)cand.push({v:'director',t:'asset20',w:age<24?6:2,n:g.act.d7,last:g.act.last})}
}
function nbrs(x,y){return[[x-1,y],[x+1,y],[x,y-1],[x,y+1],[x-1,y+1],[x+1,y+1],[x-1,y-1],[x+1,y-1]]}
function bfs(sx,sy,goals){const gs=new Set(goals.map(g=>key(g[0],g[1])));const prev=new Int32Array(W*H).fill(-1);const q=[key(sx,sy)];prev[q[0]]=q[0];
 for(let i=0;i<q.length;i++){const k=q[i];if(gs.has(k)&&i>0){const path=[];let c=k;while(c!==q[0]){path.push([c%W,(c/W)|0]);c=prev[c]}return path.reverse()}
  const x=k%W,y=(k/W)|0;for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=W||ny>=H)continue;const nk=key(nx,ny);if(prev[nk]>=0)continue;
   if(blocked[nk])continue;if(seatSet.has(nk)&&!gs.has(nk))continue;prev[nk]=k;q.push(nk)}}return null}
const anchor=(tx,ty)=>({x:(tx+.5)*T,y:(ty+.85)*T});
// ---------- визиты
function schedule(){
 if(!cand.length)return;const walking=bots.filter(b=>b.mode!=='seat').length,maxW=LAY==='wide'?5:4;if(walking>=maxW)return;
 const ok=cand.filter(c=>{const v=bySlug[c.v];if(!v||v.mode!=='seat'||v.lock||v.st==='sleep')return false;if(sel&&sel.slug===c.v)return false;
  if((pairCool[c.v+'>'+c.t]||0)>animTime)return false;if(c.t==='asset20')return true;const t=bySlug[c.t];return t&&t.mode==='seat'});
 if(!ok.length)return;let r=Math.random()*ok.reduce((s,c)=>s+c.w,0),pick=ok[0];for(const c of ok){r-=c.w;if(r<=0){pick=c;break}}
 startVisit(pick)}
function startVisit(c){const v=bySlug[c.v];let goals,sitAt=null,t=null;
 if(c.t==='asset20'){const z=zoneById.asset20;if(!z||reserved.has(key(z.bossSeat.x,z.bossSeat.y)))return;goals=[[z.bossSeat.x,z.bossSeat.y]];sitAt=z.bossSeat}
 else{t=bySlug[c.t];goals=t.stand.filter(([x,y])=>free(x,y)&&!seatSet.has(key(x,y))&&!reserved.has(key(x,y)))}
 if(!goals.length)return;const path=bfs(v.seat.x,v.seat.y,goals);pairCool[c.v+'>'+c.t]=animTime+9000;if(!path)return;
 const end=path[path.length-1];reserved.add(key(end[0],end[1]));
 v.pts=path.map(p=>anchor(p[0],p[1]));if(sitAt)v.pts[v.pts.length-1]=anchor(sitAt.x,sitAt.y);
 v.mode='go';v.goal=end;v.target=t;v.c=c;v.talkT=0;if(t){t.lock++}}
function stepBot(b,dt){
 if(b.mode==='seat'){b.x+=(b.sit.x-b.x)*Math.min(1,dt/200);b.y+=(b.sit.y-b.y)*Math.min(1,dt/200);return}
 if(b.mode==='talk'){b.talkT-=dt;if(b.talkT<=0){const path=bfs(b.goal[0],b.goal[1],[[b.seat.x,b.seat.y]]);reserved.delete(key(b.goal[0],b.goal[1]));if(b.target)b.target.lock--;
   if(b.target)b.target.talkWith=null;b.pts=path?path.map(p=>anchor(p[0],p[1])):[];b.pts.push({x:b.sit.x,y:b.sit.y});b.mode='back'}return}
 const sp=0.07*dt;let left=sp;while(left>0&&b.pts.length){const p=b.pts[0],d=Math.hypot(p.x-b.x,p.y-b.y);if(d<=left){b.x=p.x;b.y=p.y;left-=d;b.pts.shift()}else{b.x+=(p.x-b.x)/d*left;b.y+=(p.y-b.y)/d*left;b.face=p.x<b.x-0.1?-1:(p.x>b.x+0.1?1:b.face);left=0}}
 if(!b.pts.length){if(b.mode==='go'){b.mode='talk';b.talkT=b.c.t==='asset20'?5200:2800;if(b.target)b.target.talkWith=b}else{b.mode='seat'}}
}
// ---------- рисование: спрайты
const BASE=[
"...hhhh...",
"..hhhhhh..",
".hhhhhhhh.",
".hssssssh.",
".sesssses.",
".ssssssss.",
"..ssmmss..",
"..cccccc..",
".cccccccc.",
"scccccccs.",
"s.cccccc.s",
"..pppppp..",
"..pp..pp..",
"..bb..bb.."];
const SK=['#f1c9a5','#e0ac80','#c98e62','#f5d6b8'];
function hsh(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function drawSprite(b,x,y,frame){
 const P=1.6,lk=b.look||{},h=hsh(b.slug);const col={h:lk.hair||'#3a2a1a',s:SK[h%4],e:'#1b1b2a',m:'#b0605a',c:lk.shirt||'#888',p:'#2c3350',b:'#15182a'};
 const px=(c,r,color)=>{ctx.fillStyle=color;ctx.fillRect(x+(c-5)*P,y+(r-14)*P,P+.04,P+.04)};
 ctx.fillStyle='rgba(0,0,0,.18)';ctx.beginPath();ctx.ellipse(x,y,7,2.6,0,0,7);ctx.fill();
 for(let r=0;r<14;r++)for(let c=0;c<10;c++){const ch=BASE[r][c];if(ch==='.')continue;if(frame&&r===13&&((c<5)===(frame===1)))continue;if(frame&&r===12&&((c<5)===(frame===1)))continue;px(c,r,col[ch])}
 const st=lk.style||'short';
 if(st==='long'){for(let r=3;r<9;r++){px(0,r,col.h);px(9,r,col.h)}px(1,3,col.h);px(8,3,col.h)}
 if(st==='bun'){px(4,-1,col.h);px(5,-1,col.h);px(4,-2,col.h);px(5,-2,col.h);px(3,-1,col.h);px(6,-1,col.h)}
 if(st==='spiky'){px(2,-1,col.h);px(4,-1,col.h);px(6,-1,col.h);px(8,0,col.h);px(1,1,col.h)}
 if(st==='cap'){const cc=lk.shirt||'#c00';for(let c=1;c<9;c++){px(c,1,cc);px(c,2,cc)}for(let c=2;c<8;c++)px(c,0,cc);px(0,3,cc);px(1,3,cc);px(2,3,cc)}
 if(st==='tubeteika'){for(let c=2;c<8;c++){px(c,0,'#1b5e20');px(c,1,'#1b5e20')}px(3,1,'#fff');px(6,1,'#fff')}
 if(st==='band'){for(let c=1;c<9;c++)px(c,2,'#fff');px(1,2,'#e53935');px(8,2,'#e53935')}
 if(st==='beret'){for(let c=1;c<9;c++){px(c,0,'#c62828');px(c,1,'#c62828')}px(9,1,'#c62828');px(5,-1,'#c62828')}
 const a=lk.acc;
 if(a==='glasses'){for(let c=1;c<9;c++)px(c,4,'#222');px(2,4,'#9fd3ff');px(7,4,'#9fd3ff')}
 if(a==='tie'){px(4,7,'#c62828');px(5,7,'#c62828');px(4,8,'#c62828');px(5,8,'#c62828');px(5,9,'#c62828');px(4,10,'#c62828');px(2,7,'#fff');px(7,7,'#fff')}
 if(a==='headset'){px(0,3,'#444');px(0,4,'#444');px(9,3,'#444');px(9,4,'#444');for(let c=1;c<9;c++)px(c,0,'#444');px(1,5,'#444');px(2,6,'#444')}

function stats(){if(!D)return;const busy=bots.filter(b=>b.st==='busy').length,today=bots.filter(b=>b.st==='busy'||b.st==='today').length,walk=bots.filter(b=>b.mode!=='seat').length;
 document.getElementById('stats').textContent=`Зон ${zones.length} • Ботов ${bots.length} • Заняты сейчас ${busy} • Активны сегодня ${today} • Идут к коллегам ${walk}`;
 document.getElementById('upd').textContent='Данные: '+fmtAbs(D.generated)+' (Астана), обновляются сами'}
setInterval(stats,1000);
// ---------- карточки
function closeCard(){card.style.display='none';sel=null;selZone=null}
function showCard(h){card.innerHTML=h;card.style.display='block';card.scrollTop=0;card.querySelectorAll('[data-s]').forEach(el=>el.onclick=()=>openBot(bySlug[el.dataset.s]))}
function openZone(z){sel=null;selZone=z;viewIdx=zones.indexOf(z);setWhere();
 const n=z.bots.length,busy=z.bots.filter(b=>b.st==='busy').length,today=z.bots.filter(b=>b.st==='busy'||b.st==='today').length,desk=z.bots.filter(b=>b.mode==='seat').length;
 let h=`<h2><span class="dot" style="background:${z.color}"></span>${esc(z.kind==='cabinet'?'Кабинет директора':z.name)}</h2><div class="sub">${n} ${plural(n,'бот','бота','ботов')} • ${desk} за столом • ${busy} ${plural(busy,'занят','заняты','заняты')} сейчас • ${today} активны сегодня</div>`;
 if(z.id==='asset20'){const g=(D.groups||[]).find(g=>g.slug==='asset20');h+=`<div class="row">Общий чат зон. Здесь сидят Дух, Тело и Бизнес; Директор подходит к столу за сводками.</div>`;if(g)h+=`<div class="row"><span class="k">Чат активен:</span> ${fmtAgo(g.act.last)} · ${g.act.d1} сообщ. за сутки · ${g.act.d7} за 7 дней</div>`}
 h+='<div class="list">';z.bots.slice().sort((a,b)=>(b.act.last||0)-(a.act.last||0)).forEach(b=>{h+=`<div data-s="${b.slug}"><span><span class="dot" style="background:${ST[b.st][0]};margin-right:8px"></span>${esc(b.name)}${b.test?' <span class="tag t">тест</span>':''}</span><span class="k">${fmtAgo(b.act.last)}</span></div>`});
 h+='</div><button class="back">Вернуться</button>';showCard(h);card.querySelector('.back').onclick=goAll;fitInto(z.x*T,z.y*T-8,z.w*T,z.h*T+8,4)}
function openBot(b,keep){sel=b;selZone=zoneById[b.zone];if(!keep){viewIdx=zones.indexOf(selZone);setWhere()}
 const a=b.act,st=ST[b.st];
 let h=`<h2><span class="dot" style="background:${st[0]}"></span>${esc(b.name)}${b.test?' <span class="tag t">тест</span>':''}${b.boss?' <span class="tag">главный</span>':''}</h2><div class="sub">${esc(b.role)}</div>`;
 h+=`<div class="row"><b>${st[1]}</b>${waiting(b)?' · есть входящее без ответа':''}${b.mode!=='seat'?' · сейчас идёт к коллеге':''}</div>`;
 h+=`<div class="row"><span class="k">Последняя активность:</span> ${fmtAgo(a.last)} (${fmtAbs(a.last)})</div>`;
 h+=`<div class="row"><span class="k">Сообщений:</span> ${a.d1} за сутки · ${a.d7} за 7 дней · всего ${a.total}</div>`;
 h+=`<div class="spark">${a.days.map(v=>`<i style="height:${v?Math.min(26,4+Math.log2(1+v)*3.5):2}px;opacity:${v?.9:.18}"></i>`).join('')}</div><div class="k" style="font-size:11px">активность за 14 дней</div>`;
 const rs=a.routines||[];h+=`<div class="row"><span class="k">Рутины (по факту запусков):</span> `+(rs.length?rs.map(r=>`<span class="chip ${r.state==='работает'?'':'g'}">⏰ ~${r.time} · ${r.state} · ${fmtAbs(r.last)}</span>`).join(''):'регулярных автозапусков не видно')+`</div>`;
 if(a.bg_stops)h+=`<div class="row">⚠️ Фоновых задач остановлено по таймауту за 7 дней: ${a.bg_stops}</div>`;
 const t=b.tasks||{},parts=[];if(t.need_you)parts.push('нужно от тебя '+t.need_you);if(t.waiting)parts.push('ждёт других '+t.waiting);if(t.in_work)parts.push('в работе '+t.in_work);if(t.postponed)parts.push('отложено '+t.postponed);
 h+=`<div class="row"><span class="k">Задачи в трекере${D.tracker&&D.tracker.as_of?' (на '+fmtAbs(Date.parse(D.tracker.as_of))+')':''}:</span> ${parts.length?parts.join(' · '):'нет'}</div>`;
 const peers={};(D.links||[]).filter(l=>l.kind==='data'&&(l.from===b.slug||l.to===b.slug)).forEach(l=>{const o=l.from===b.slug?l.to:l.from;const p=peers[o]||(peers[o]={o,out:0,inn:0});if(l.from===b.slug)p.out+=l.n;else p.inn+=l.n});
 const pl=Object.values(peers).filter(p=>bySlug[p.o]||p.o==='asset20').sort((x,y)=>(y.out+y.inn)-(x.out+x.inn));
 if(pl.length)h+=`<div class="row"><span class="k">Общается с (сообщений за 30 дней: → от него, ← к нему):</span><br>`+pl.map(p=>`<span class="chip" ${bySlug[p.o]?`data-s="${p.o}"`:''}>${esc(bySlug[p.o]?bySlug[p.o].short||bySlug[p.o].name:'Asset 2.0')} · ${[p.out?'→'+p.out:'',p.inn?'←'+p.inn:''].filter(Boolean).join(' ')}</span>`).join('')+`</div>`;
 if(b.zone==='asset20')h+=`<div class="row"><span class="chip g">Участник группы Asset 2.0</span></div>`;
 if(b.slug==='whatsapp')h+=`<div class="row">🔒 Единственный бот с доступом к WhatsApp</div>`;
 h+='<button class="back">Вернуться</button>';showCard(h);card.querySelector('.back').onclick=()=>openZone(selZone);
 if(!keep)fitInto(b.sit.x-80,b.sit.y-60,160,90,4)}
function goAll(){closeCard();viewIdx=-1;setWhere();fitAll()}
function setWhere(){document.getElementById('where').textContent=viewIdx<0?'Весь офис':(zones[viewIdx].kind==='cabinet'?'Кабинет директора':zones[viewIdx].name)}
// ---------- ввод
let ptrs=new Map(),drag=null,moved=false,pinch=null;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=false;camT=null;
 if(ptrs.size===1)drag={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y};if(ptrs.size===2){const p=[...ptrs.values()];pinch={d:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y),s:cam.s};drag=null}});
cv.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(pinch&&ptrs.size===2){const p=[...ptrs.values()];cam.s=Math.max(.3,Math.min(7,pinch.s*Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y)/pinch.d));moved=true}
 else if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>6)moved=true;if(moved){cam.x=drag.cx-dx/cam.s;cam.y=drag.cy-dy/cam.s}}});
function up(e){ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;if(!ptrs.size){if(!moved)tap(e.clientX,e.clientY);drag=null}}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',e=>{ptrs.delete(e.pointerId);drag=null;pinch=null});
cv.addEventListener('wheel',e=>{e.preventDefault();const[wx,wy]=s2w(e.clientX,e.clientY);const ns=Math.max(.3,Math.min(7,cam.s*Math.exp(-e.deltaY*.0015)));cam.x=wx-(e.clientX-vw()/2)/ns;cam.y=wy-(e.clientY-vh()/2)/ns;cam.s=ns;camT=null},{passive:false});
function tap(x,y){if(!D)return;const[wx,wy]=s2w(x,y);let best=null,bd=1e9;
 bots.forEach(b=>{const d=Math.hypot(b.x-wx,b.y-12-wy);if(d<bd){bd=d;best=b}});
 // подпись тоже кликабельна
 bots.forEach(b=>{const[sx,sy]=w2s(b.x,b.y+3);if(Math.abs(x-sx)<34&&y>sy-2&&y<sy+18){best=b;bd=0}});
 if(best&&bd<Math.max(14,18/cam.s))return openBot(best);
 const z=zones.find(z=>wx>=z.x*T&&wx<=(z.x+z.w)*T&&wy>=z.y*T&&wy<=(z.y+z.h)*T);if(z)return openZone(z);goAll()}
document.getElementById('prev').onclick=()=>{viewIdx=viewIdx<=0?(viewIdx<0?zones.length-1:-1):viewIdx-1;viewIdx<0?goAll():openZone(zones[viewIdx])};
document.getElementById('next').onclick=()=>{viewIdx=viewIdx>=zones.length-1?-1:viewIdx+1;viewIdx<0?goAll():openZone(zones[viewIdx])};
function zoom(k){camT={from:{...cam},to:{x:cam.x,y:cam.y,s:Math.max(.3,Math.min(7,cam.s*k))},t:performance.now()}}
document.getElementById('zin').onclick=()=>zoom(1.4);document.getElementById('zout').onclick=()=>zoom(1/1.4);
document.getElementById('pause').onclick=e=>{paused=!paused;e.currentTarget.textContent=paused?'▶':'❚❚';e.currentTarget.classList.toggle('on',paused)};
const lg=document.getElementById('legend');
lg.innerHTML=`<b>Как читать</b><br>Это один офис: каждый бот сидит за своим столом в своей зоне.<br>🚶 Бот встал и идёт к коллеге: значит, они реально переписывались (чем свежее и чаще, тем чаще ходит).<br>💬 Облачко: сейчас общаются.<br>💡 Лампочка: работает прямо сейчас.<br>💤 Zz: спит больше недели.<br>⏰ Часики: есть регулярные рутины.<br>✉️ Конверт: пришло сообщение без ответа.<br>Нажми на бота или зону, чтобы увидеть детали.`;
document.getElementById('legendBtn').onclick=()=>{lg.style.display=lg.style.display==='block'?'none':'block'};lg.onclick=()=>lg.style.display='none';
function resize(){cv.width=innerWidth*DPR;cv.height=innerHeight*DPR;if(pickLayout()&&D){build();closeCard();viewIdx=-1;setWhere()}if(!camT&&viewIdx<0&&!sel)fitAll(true)}
addEventListener('resize',resize);pickLayout();resize();load();setInterval(load,5*60e3);requestAnimationFrame(frame);
</script>
</body>
