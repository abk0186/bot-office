 try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){} // iOS: играть и в беззвучном режиме

 if(SND.ctx){const c=SND.ctx;if(on&&c.state!=='running')c.resume();SND.gain.gain.cancelScheduledValues(c.currentTime);SND.gain.gain.setTargetAtTime(v,c.currentTime,.3)}else SND.el.volume=v;

 bots.forEach(b=>{if(b.place==='prayer'&&!(curStep()&&curStep().k==='dua'&&b.slug===imamSlug))return;const[sx,sy]=w2s(RX(b),RY(b),headH(b)*.6);const d=Math.hypot(sx-cx,sy-cy);if(d<bd){bd=d;best=b}});
