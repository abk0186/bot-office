@media (max-width:440px){#where{min-width:78px;max-width:96px;font-size:12px}#bar{gap:4px;padding:5px;width:calc(100vw - 16px)}#bar .grp{gap:4px}#bar button{min-width:36px;padding:0 7px;height:38px}}

 <div class="grp"><button id="rotl" aria-label="Повернуть влево">⟲</button><button id="rotr" aria-label="Повернуть вправо">⟳</button><button id="topv" aria-label="Вид сверху">Сверху</button>
 <button id="zout" aria-label="Отдалить">−</button><button id="zin" aria-label="Приблизить">+</button>

<script>
'use strict';
const T=16,DPR=Math.min(window.devicePixelRatio||1,2),FS=2;
const cv=document.getElementById('c'),octx=cv.getContext('2d'),gcv=document.getElementById('g'),card=document.getElementById('card');
let ctx=octx;const floorCv=document.createElement('canvas'),fctx=floorCv.getContext('2d');
let D=null,LAY=null,L=null,W=24,H=36,zones=[],zoneById={},bots=[],bySlug={},links=[];
let blocked=null,seatSet=new Set(),reserved=new Set(),decor=[],cand=[],pairCool={},bench=[],lounge=[],sofas=[];
let view={tx:200,tz:300,az:0,tilt:.72,zoom:1},viewT=null,paused=false,sel=null,selZone=null,viewIdx=-1,animTime=0,schedT=0;
// ---------- время/формат
const pad=n=>String(n).padStart(2,'0');
const ast=ms=>new Date(ms+5*3600e3);
function fmtAbs(ms){if(!ms)return '—';const d=ast(ms),k=x=>x.toISOString().slice(0,10),hm=pad(d.getUTCHours())+':'+pad(d.getUTCMinutes());
 if(k(d)===k(ast(Date.now())))return 'сегодня '+hm;if(k(d)===k(ast(Date.now()-864e5)))return 'вчера '+hm;return pad(d.getUTCDate())+'.'+pad(d.getUTCMonth()+1)+' '+hm}
function plural(n,a,b,c){n=Math.abs(n);const m=n%10,h=n%100;return m==1&&h!=11?a:(m>=2&&m<=4&&(h<10||h>=20)?b:c)}
function fmtAgo(ms){if(!ms)return 'нет данных';const m=(Date.now()-ms)/6e4;if(m<2)return 'только что';if(m<60)return Math.round(m)+' мин назад';if(m<1440)return Math.round(m/60)+' ч назад';const d=Math.round(m/1440);return d+' '+plural(d,'день','дня','дней')+' назад'}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
// ---------- статус
function status(b){const last=b.act.last||b.last_file||0,age=Date.now()-last;if(last&&age<30*6e4)return 'busy';if(last&&age<864e5)return 'today';if(last&&age<7*864e5)return 'week';return 'sleep'}
const ST={busy:['#ffc400','Работает сейчас'],today:['#36c26b','Был активен сегодня'],week:['#5b8cff','Активен на этой неделе'],sleep:['#9aa0b5','Спит больше недели']};
const waiting=b=>b.act.waiting&&b.act.last_user&&Date.now()-b.act.last_user<3*864e5;
const waitOn=b=>!b.boss&&b.act.asks_since&&Date.now()-b.act.asks_since<7*864e5;
function fmtSince(ms){const d=ast(ms),hm=pad(d.getUTCHours())+':'+pad(d.getUTCMinutes());return d.toISOString().slice(0,10)===ast(Date.now()).toISOString().slice(0,10)?hm:pad(d.getUTCDate())+'.'+pad(d.getUTCMonth()+1)+' '+hm}
// ---------- раскладка
function pickLayout(){const k=innerWidth/innerHeight<1.3?'tall':'wide';if(k===LAY)return false;LAY=k;return true}
const key=(x,y)=>y*W+x;
function block(x,y){if(x>=0&&y>=0&&x<W&&y<H)blocked[key(x,y)]=1}
const free=(x,y)=>x>=0&&y>=0&&x<W&&y<H&&!blocked[key(x,y)];
function build(){
 if(!D)return;L=D.layouts[LAY];W=L.W;H=L.H;blocked=new Uint8Array(W*H);seatSet=new Set();reserved=new Set();decor=[];bench=[];lounge=[];sofas=[];
 for(let x=0;x<W;x++){block(x,0);block(x,H-1)}for(let y=0;y<H;y++){block(0,y);block(W-1,y)}
 zones=D.zones.filter(z=>L.zones[z.id]).map(z=>{const[x,y,w,h]=L.zones[z.id];return Object.assign({},z,{x,y,w,h,bots:[]})});zoneById={};zones.forEach(z=>zoneById[z.id]=z);
 const prev={};bots.forEach(b=>prev[b.slug]=b);
 bots=D.bots.map(b=>Object.assign({},b,{zone:zoneById[b.zone]?b.zone:'lab'}));bySlug={};
 bots.forEach(b=>{bySlug[b.slug]=b;zoneById[b.zone].bots.push(b);b.st=status(b)});
 zones.forEach(z=>{
  if(z.kind==='cabinet'){ // стены, дверь, большой стол
   const door=LAY==='tall'?'bottom':'right';
   for(let y=z.y;y<=z.y+z.h;y++)if(!(door==='right'&&(y===z.y+2||y===z.y+3)))block(z.x+z.w,y);
   for(let x=z.x;x<=z.x+z.w;x++)if(!(door==='bottom'&&(x===z.x+4||x===z.x+5)))block(x,z.y+z.h);
   z.door=door==='bottom'?{x:z.x+4,y:z.y+z.h,w:2,h:1}:{x:z.x+z.w,y:z.y+2,w:1,h:2};
   const bx=z.x+Math.floor(z.w/2)-1,by=z.y+3;for(let i=0;i<3;i++){block(bx+i,by);block(bx+i,by+1)}
   z.big={x:bx,y:by};for(let i=1;i<=3;i++)block(z.x+i,z.y);decor.push({t:'shelf',x:z.x+1,y:z.y});
   block(z.x+z.w-1,z.y);decor.push({t:'plant',x:z.x+z.w-1,y:z.y});block(z.x,z.y+z.h-1);decor.push({t:'plant',x:z.x,y:z.y+z.h-1});
   z.bots.forEach(b=>{b.kind='boss';b.seat={x:bx+1,y:by-1};b.sit={x:(bx+1.5)*T,y:(by-1+.85)*T};b.stand=[[bx+1,by+2],[bx,by+2],[bx+2,by+2],[bx-1,by+1],[bx+3,by+1]]});
  }else if(z.kind==='table'){
   const tx=Math.floor(z.x+z.w/2),ty=Math.floor(z.y+z.h/2)+1;for(let x=tx-1;x<=tx+1;x++)for(let y=ty-1;y<=ty;y++)block(x,y);
   z.table={x:tx,y:ty};const seats=[[tx,ty-2],[tx-2,ty-1],[tx+2,ty-1],[tx,ty+1]];z.seats=seats;
   z.bots.forEach((b,i)=>{const s=seats[i%3];b.kind='table';b.seat={x:s[0],y:s[1]};b.sit={x:(s[0]+.5)*T,y:(s[1]+.85)*T};b.stand=nbrs(s[0],s[1])});
   z.bossSeat={x:seats[3][0],y:seats[3][1]};
   block(z.x+z.w-1,z.y);decor.push({t:'plant',x:z.x+z.w-1,y:z.y});block(z.x,z.y);decor.push({t:'plant',x:z.x,y:z.y});
   decor.push({t:'board',x:z.x+2,y:z.y});block(z.x+2,z.y);block(z.x+3,z.y);
  }else if(z.kind==='lounge'){
   const rowsY=z.h>=5?[z.y+1,z.y+3]:[z.y+1];
   rowsY.forEach((ry,ri)=>{for(let sx=z.x+1+ri;sx<=z.x+z.w-2;sx+=2){lounge.push({x:sx,y:ry});sofas.push({x:sx,y:ry,w:1})}});
   if(z.h>=5)for(let tx=z.x+3;tx<=z.x+z.w-4;tx+=6){block(tx,z.y+2);block(tx+1,z.y+2);decor.push({t:'ctable',x:tx,y:z.y+2})}
   block(z.x+z.w-1,z.y+1);decor.push({t:'coffee',x:z.x+z.w-1,y:z.y+1});
  }else{
   const n=z.bots.length,cols=Math.max(1,Math.min(n,Math.floor(z.w/4))),cw=z.w/cols;
   z.bots.forEach((b,i)=>{const c=i%cols,r=Math.floor(i/cols);const dx=Math.round(z.x+cw*c+(cw-2)/2),sy=z.y+2+r*4;
    block(dx,sy+1);block(dx+1,sy+1);b.kind='desk';b.desk={x:dx,y:sy+1};b.seat={x:dx,y:sy};b.sit={x:(dx+1)*T,y:(sy+.85)*T};
    b.stand=[[dx-1,sy],[dx+2,sy],[dx,sy-1],[dx+1,sy-1],[dx-1,sy+1],[dx+2,sy+1]]});
   if(free(z.x+z.w-1,z.y)){block(z.x+z.w-1,z.y);decor.push({t:'plant',x:z.x+z.w-1,y:z.y})}
   // низкая перегородка слева с проходом посередине
   if(z.x>2&&!blocked[key(z.x-1,z.y+1)]){const mid=z.y+Math.floor(z.h/2);for(let y=z.y;y<z.y+z.h;y++){if(y===mid||y===mid-1)continue;block(z.x-1,y);decor.push({t:'part',x:z.x-1,y})}}
  }
 });
 // кулер и диван в свободных местах
 if(L.bench)for(let i=0;i<L.bench[2];i+=2)bench.push({x:L.bench[0]+i,y:L.bench[1]});
 const extra=LAY==='wide'?[]:[{t:'cooler',x:22,y:9,w:1}];
 extra.forEach(e=>{let ok=true;for(let i=0;i<e.w;i++)if(!free(e.x+i,e.y))ok=false;if(ok){for(let i=0;i<e.w;i++)block(e.x+i,e.y);decor.push(e)}});
 bots.forEach(b=>{seatSet.add(key(b.seat.x,b.seat.y));const p=prev[b.slug];
  b.x=b.sit.x;b.y=b.sit.y;b.mode='seat';b.talkWith=null;b.lock=0;b.deskSeat=b.seat;b.deskSit=b.sit;b.place='desk';b.slot=null});
 bench.concat(lounge).forEach(t=>seatSet.add(key(t.x,t.y)));
 Object.values(zoneById).forEach(z=>{if(z.bossSeat)seatSet.add(key(z.bossSeat.x,z.bossSeat.y))});
 computeCand();assignPlaces(true);
}
function computeCand(){
 // кандидаты визитов из реальных сообщений между ботами
 links=(D.links||[]).filter(l=>l.kind==='data');cand=[];
 links.forEach(l=>{if(!l.last)return;const age=(Date.now()-l.last)/36e5;if(age>24*7)return;
  let v=l.from,t=l.to;if(v==='director'&&bySlug[t])[v,t]=[t,v];
  if(!bySlug[v])return;const target=bySlug[t]?t:(t==='asset20'?'asset20':null);if(!target)return;
  const rec=age<2?8:age<24?4:age<72?2:1;cand.push({v,t:target,w:(1+Math.log2(1+l.n))*rec,n:l.n,last:l.last})});
 const g=(D.groups||[]).find(g=>g.slug==='asset20');
 if(g&&g.act&&g.act.last&&bySlug.director){const age=(Date.now()-g.act.last)/36e5;if(age<24*7)cand.push({v:'director',t:'asset20',w:age<24?6:2,n:g.act.d7,last:g.act.last})}
}
function desired(b){if(b.boss)return 'desk';if(waitOn(b))return 'bench';if(b.st==='sleep')return 'lounge';return 'desk'}
function assignPlaces(instant){const used={bench:new Set(),lounge:new Set()};
 bots.forEach(b=>{if(b.place!=='desk'&&desired(b)===b.place)used[b.place].add(b.slot)});
 bots.forEach(b=>{const d=desired(b);if(d===b.place)return;let place='desk',slot=null,seat=b.deskSeat,sit=b.deskSit;
  if(d!=='desk'){const arr=d==='bench'?bench:lounge;const i=arr.findIndex((t,k)=>!used[d].has(k));if(i>=0){used[d].add(i);place=d;slot=i;seat={x:arr[i].x,y:arr[i].y};sit=anchor(arr[i].x,arr[i].y)}}
  if(place===b.place)return;const from=b.seat;b.place=place;b.slot=slot;b.seat=seat;b.sit=sit;
  if(instant){b.x=sit.x;b.y=sit.y;b.mode='seat';return}
  if(b.mode!=='seat')return;const path=bfs(from.x,from.y,[[seat.x,seat.y]]);b.pts=path?path.map(p=>anchor(p[0],p[1])):[];b.pts.push({x:sit.x,y:sit.y});b.mode='back'})}
const standOf=t=>t.place==='desk'?t.stand:nbrs(t.seat.x,t.seat.y);
function nbrs(x,y){return[[x-1,y],[x+1,y],[x,y-1],[x,y+1],[x-1,y+1],[x+1,y+1],[x-1,y-1],[x+1,y-1]]}
function bfs(sx,sy,goals){const gs=new Set(goals.map(g=>key(g[0],g[1])));const prev=new Int32Array(W*H).fill(-1);const q=[key(sx,sy)];prev[q[0]]=q[0];
 for(let i=0;i<q.length;i++){const k=q[i];if(gs.has(k)&&i>0){const path=[];let c=k;while(c!==q[0]){path.push([c%W,(c/W)|0]);c=prev[c]}return path.reverse()}
  const x=k%W,y=(k/W)|0;for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=W||ny>=H)continue;const nk=key(nx,ny);if(prev[nk]>=0)continue;
   if(blocked[nk])continue;if(seatSet.has(nk)&&!gs.has(nk))continue;prev[nk]=k;q.push(nk)}}return null}
const anchor=(tx,ty)=>({x:(tx+.5)*T,y:(ty+.85)*T});
// ---------- визиты
function schedule(){
 if(!cand.length)return;const walking=bots.filter(b=>b.mode!=='seat').length,maxW=LAY==='wide'?5:4;if(walking>=maxW)return;
 const ok=cand.filter(c=>{const v=bySlug[c.v];if(!v||v.mode!=='seat'||v.lock||v.st==='sleep')return false;if(sel&&sel.slug===c.v)return false;
  if((pairCool[c.v+'>'+c.t]||0)>animTime)return false;if(c.t==='asset20')return true;const t=bySlug[c.t];return t&&t.mode==='seat'});
 if(!ok.length)return;let r=Math.random()*ok.reduce((s,c)=>s+c.w,0),pick=ok[0];for(const c of ok){r-=c.w;if(r<=0){pick=c;break}}
 startVisit(pick)}
function startVisit(c){const v=bySlug[c.v];let goals,sitAt=null,t=null;
 if(c.t==='asset20'){const z=zoneById.asset20;if(!z||reserved.has(key(z.bossSeat.x,z.bossSeat.y)))return;goals=[[z.bossSeat.x,z.bossSeat.y]];sitAt=z.bossSeat}
 else{t=bySlug[c.t];goals=standOf(t).filter(([x,y])=>free(x,y)&&!seatSet.has(key(x,y))&&!reserved.has(key(x,y)))}
 if(!goals.length)return;const path=bfs(v.seat.x,v.seat.y,goals);pairCool[c.v+'>'+c.t]=animTime+9000;if(!path)return;
 const end=path[path.length-1];reserved.add(key(end[0],end[1]));
 v.pts=path.map(p=>anchor(p[0],p[1]));if(sitAt)v.pts[v.pts.length-1]=anchor(sitAt.x,sitAt.y);
 v.mode='go';v.goal=end;v.target=t;v.c=c;v.talkT=0;if(t){t.lock++}}
function stepBot(b,dt){
 if(b.mode==='seat'){b.x+=(b.sit.x-b.x)*Math.min(1,dt/200);b.y+=(b.sit.y-b.y)*Math.min(1,dt/200);return}
 if(b.mode==='talk'){b.talkT-=dt;if(b.talkT<=0){const path=bfs(b.goal[0],b.goal[1],[[b.seat.x,b.seat.y]]);reserved.delete(key(b.goal[0],b.goal[1]));if(b.target)b.target.lock--;
